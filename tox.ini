# Tox (https://tox.wiki/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist =
    # See https://www.djangoproject.com/download/#supported-versions
    # See https://docs.djangoproject.com/en/dev/faq/install/#what-python-version-can-i-use-with-django
    py{311,312,313,314}-django52,
    py{312,313,314}-django60,
    py{312,313,314,315}-django61,
    py315-djangomain
isolated_build = True
skip_missing_interpreters = True

[testenv]
commands =
    python manage.py test
deps =
    Jinja2>=3.1
    django52: Django>=5.2.8,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1.3,<6.2
    djangomain: https://codeload.github.com/django/django/zip/main
